<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Kunjungan Polmas — Presisi Warga NTB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --coklat: #5C4229;
    --coklat-dark: #3A2A18;
    --krem: #F5EFE2;
    --krem-card: #FFFDF9;
    --ink: #2A2118;
    --ink-soft: #6B5D4C;
    --emas: #B8862F;
    --emas-soft: #E7D6AC;
    --hijau: #45593A;
    --hijau-soft: #E4EAD9;
    --merah: #9C3B2E;
    --garis: #E2D5BC;
    --radius: 10px;
    --shadow: 0 2px 10px rgba(58,42,24,0.08), 0 1px 2px rgba(58,42,24,0.06);
    --font-d: 'Zilla Slab', Georgia, serif;
    --font-b: 'Public Sans', system-ui, -apple-system, sans-serif;
    --font-m: 'JetBrains Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: var(--font-b);
    background: var(--krem);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(184,134,47,0.07), transparent 40%),
      radial-gradient(circle at 100% 30%, rgba(69,89,58,0.06), transparent 45%);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #app{max-width:640px;margin:0 auto;padding-bottom:48px;}

  /* ---------- TOPBAR ---------- */
  .topbar{
    background: linear-gradient(155deg, var(--coklat) 0%, var(--coklat-dark) 100%);
    color: #F5EFE2;
    padding: 22px 20px 26px;
    border-radius: 0 0 22px 22px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .topbar::after{
    content:"";
    position:absolute; right:-40px; top:-40px; width:160px; height:160px;
    border-radius:50%; border: 2px solid rgba(245,239,226,0.12);
  }
  .eyebrow{
    font-family: var(--font-m); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--emas-soft); margin:0 0 6px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--emas-soft);}
  .topbar h1{
    font-family: var(--font-d); font-weight:700; font-size: 22px;
    margin: 0 0 4px; line-height:1.25;
  }
  .topbar p.sub{margin:0; font-size:13px; color:#D9CBB0; font-weight:400;}
  .topnav{display:flex; gap:6px; margin-top:16px;}
  .topnav button{
    flex:1; font-family:var(--font-b); font-weight:600; font-size:11.5px;
    padding:9px 4px; border-radius:8px; border:1px solid rgba(245,239,226,0.25);
    background: rgba(245,239,226,0.08); color:#F5EFE2; cursor:pointer;
    transition: background .15s; white-space:nowrap;
  }
  .topnav button.active{background:var(--emas); color:var(--coklat-dark); border-color:var(--emas);}
  .topnav button:hover{background: rgba(245,239,226,0.18);}
  .topnav button.active:hover{background:var(--emas);}

  main{padding: 18px 16px 0;}

  /* ---------- STEPPER ---------- */
  .stepper{display:flex; align-items:center; margin: 4px 4px 18px;}
  .stepper .seg{flex:1; display:flex; flex-direction:column; align-items:center; position:relative;}
  .stepper .seg .num{
    width:28px;height:28px;border-radius:50%;
    background:var(--krem-card); border:2px solid var(--garis);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-m); font-size:12px; font-weight:600; color:var(--ink-soft);
    z-index:2; transition: all .2s;
  }
  .stepper .seg.done .num{background:var(--hijau); border-color:var(--hijau); color:#fff;}
  .stepper .seg.current .num{background:var(--emas); border-color:var(--emas); color:var(--coklat-dark);}
  .stepper .seg .line{
    position:absolute; top:13px; left:-50%; width:100%; height:2px;
    background:var(--garis); z-index:1;
  }
  .stepper .seg:first-child .line{display:none;}
  .stepper .seg.done .line{background:var(--hijau);}
  .stepper .label{font-size:9.5px; color:var(--ink-soft); margin-top:5px; text-align:center; max-width:64px; line-height:1.2;}

  /* ---------- CARD ---------- */
  .card{
    background:var(--krem-card); border:1px solid var(--garis); border-radius:var(--radius);
    box-shadow: var(--shadow); padding:20px 18px; margin-bottom:16px;
  }
  .card h2{
    font-family:var(--font-d); font-size:18px; margin:0 0 3px; color:var(--coklat-dark);
  }
  .card .desc{font-size:13px; color:var(--ink-soft); margin:0 0 18px;}
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:12.5px; font-weight:600; color:var(--coklat-dark);
    margin-bottom:6px; letter-spacing:0.01em;
  }
  .field .hint{font-size:11.5px; color:var(--ink-soft); margin-top:5px;}
  input[type=text], input[type=date], input[type=tel], input[type=number], textarea, select{
    width:100%; font-family:var(--font-b); font-size:14.5px; color:var(--ink);
    padding:10px 12px; border:1.5px solid var(--garis); border-radius:8px;
    background:#fff; outline:none; transition: border-color .15s;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--emas);}
  textarea{resize:vertical; min-height:76px; font-family:var(--font-b);}
  .row2{display:flex; gap:12px;}
  .row2 > div{flex:1;}

  /* ---------- GENDER CHIP (lingkaran) ---------- */
  .gender-row{display:flex; gap:14px;}
  .gender-chip{
    flex:1; position:relative; padding:14px 10px; text-align:center; cursor:pointer;
    border-radius:8px; border:1.5px solid var(--garis); background:#fff;
    font-family:var(--font-d); font-weight:600; font-size:16px; color:var(--ink);
    user-select:none;
  }
  .gender-chip svg{
    position:absolute; inset:-10px -6px; width:calc(100% + 12px); height:calc(100% + 20px);
    pointer-events:none; opacity:0; transition: opacity .18s;
  }
  .gender-chip.selected svg{opacity:1;}
  .gender-chip.selected{color:var(--merah); font-weight:700;}
  .gender-chip path{fill:none; stroke:var(--merah); stroke-width:3.2; stroke-linecap:round;}

  /* ---------- ASPEK GRID ---------- */
  .aspek-grid{display:flex; gap:10px;}
  .aspek-subcol{flex:1; display:flex; flex-direction:column; gap:8px;}
  .aspek-item{
    display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px;
    border:1.5px solid var(--garis); background:#fff; cursor:pointer; font-size:12.8px;
    line-height:1.2;
  }
  .aspek-item.checked{background:var(--hijau-soft); border-color:var(--hijau);}
  .aspek-box{
    width:17px;height:17px; flex:none; border:1.6px solid var(--ink-soft); border-radius:4px;
    display:flex; align-items:center; justify-content:center; background:#fff;
  }
  .aspek-item.checked .aspek-box{background:var(--hijau); border-color:var(--hijau);}
  .aspek-box svg{width:11px;height:11px; opacity:0;}
  .aspek-item.checked .aspek-box svg{opacity:1;}

  /* ---------- TOGGLE (warga II) ---------- */
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; background:var(--hijau-soft); border-radius:8px; margin-bottom:16px;
  }
  .toggle-row span{font-size:13.5px; font-weight:600; color:var(--hijau);}
  .switch{position:relative; width:44px; height:24px; flex:none;}
  .switch input{opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; z-index:2;}
  .switch .track{position:absolute; inset:0; background:#C9C0AC; border-radius:20px; transition:.2s;}
  .switch .thumb{position:absolute; top:3px; left:3px; width:18px; height:18px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,0.3);}
  .switch input:checked + .track{background:var(--hijau);}
  .switch input:checked + .track + .thumb{transform:translateX(20px);}

  /* ---------- UPLOAD FOTO ---------- */
  .upload-box{
    border:2px dashed var(--garis); border-radius:10px; padding:20px; text-align:center;
    cursor:pointer; background:#fff; transition:background .15s, border-color .15s;
  }
  .upload-box:hover{border-color:var(--emas);}
  .upload-box.drag-over{border-color:var(--emas); background:var(--hijau-soft);}
  .upload-box .icon{font-size:26px; margin-bottom:6px;}
  .upload-box .txt{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .qdoc-group{border-top:1px dashed var(--garis); padding-top:14px; margin-top:14px;}
  .qdoc-group:first-child{border-top:none; padding-top:0; margin-top:0;}
  .qdoc-group-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .qdoc-group-head span{font-family:var(--font-d); font-weight:700; font-size:14px; color:var(--coklat-dark);}
  .qdoc-rm-group{font-size:11px; font-weight:600; color:var(--merah); background:none; border:none; cursor:pointer; padding:2px 4px;}
  .thumbs{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
  .thumb{position:relative; width:100%; aspect-ratio:2/1; border-radius:8px; overflow:hidden; border:1.5px solid var(--garis); background:#f2ede0;}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .rm{
    position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%;
    background:rgba(42,33,24,0.75); color:#fff; border:none; font-size:13px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }

  /* ---------- SIGNATURE ---------- */
  .sig-block{margin-bottom:20px;}
  .sig-label{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .sig-label span{font-size:12.5px; font-weight:700; color:var(--coklat-dark);}
  .sig-label button{
    font-size:11px; font-family:var(--font-b); font-weight:600; color:var(--merah);
    background:none; border:none; cursor:pointer; padding:2px 4px;
  }
  .sig-pad-wrap{
    border:1.5px solid var(--garis); border-radius:8px; background:#fff;
    background-image: repeating-linear-gradient(transparent, transparent 30px, #F0E9D8 31px);
    position:relative; overflow:hidden;
  }
  .sig-copied-overlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(245,239,226,0.88); font-size:12.5px; color:var(--ink-soft); font-weight:600; text-align:center; padding:0 16px;
  }
  .sig-pad-wrap.copied .sig-copied-overlay{display:flex;}
  .sig-pad-wrap.copied canvas{pointer-events:none;}
  canvas.sig-pad{width:100%; height:140px; display:block; touch-action:none;}
  .sig-baseline{position:absolute; left:12px; right:12px; bottom:26px; border-bottom:1px dashed #C9BA9C; pointer-events:none;}
  .sig-copy{
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft);
    margin-bottom:10px; background:var(--krem); padding:8px 10px; border-radius:8px;
  }

  /* ---------- BUTTONS ---------- */
  .btn-row{display:flex; gap:10px; margin-top:6px;}
  .btn{
    flex:1; padding:13px 14px; border-radius:9px; border:none; cursor:pointer;
    font-family:var(--font-b); font-weight:700; font-size:14px; letter-spacing:0.01em;
    transition: transform .1s, opacity .15s;
  }
  .btn:active{transform: scale(0.98);}
  .btn-primary{background:var(--coklat); color:#F5EFE2;}
  .btn-primary:hover{background:var(--coklat-dark);}
  .btn-ghost{background:#fff; color:var(--coklat); border:1.5px solid var(--garis);}
  .btn-gold{background:var(--emas); color:var(--coklat-dark);}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btn-full{width:100%;}

  /* ---------- SUMMARY ---------- */
  .sum-block{border-top:1px dashed var(--garis); padding-top:12px; margin-top:12px;}
  .sum-block:first-child{border-top:none; padding-top:0; margin-top:0;}
  .sum-title{font-family:var(--font-d); font-weight:700; font-size:14.5px; color:var(--coklat-dark); margin:0 0 8px;}
  .sum-row{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:3px 0; color:var(--ink);}
  .sum-row .k{color:var(--ink-soft);}
  .sum-tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:4px;}
  .sum-tag{background:var(--hijau-soft); color:var(--hijau); font-size:11px; padding:3px 8px; border-radius:20px; font-weight:600;}

  .banner-err{background:#F7E5E1; border:1px solid var(--merah); color:var(--merah); padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:14px;}
  .banner-ok{background:var(--hijau-soft); border:1px solid var(--hijau); color:var(--hijau); padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:14px;}

  /* ---------- SUCCESS ---------- */
  .success{text-align:center; padding:26px 10px;}
  .success .ring{
    width:72px; height:72px; border-radius:50%; background:var(--hijau-soft); color:var(--hijau);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:34px;
    border:2px solid var(--hijau);
  }
  .success h2{font-family:var(--font-d); margin:0 0 6px;}
  .success p{color:var(--ink-soft); font-size:13.5px; margin:0 0 20px;}
  .success .idbox{font-family:var(--font-m); background:var(--krem); padding:8px 14px; border-radius:8px; display:inline-block; font-size:13px; margin-bottom:22px;}

  /* ---------- HISTORY ---------- */
  .search-box{margin-bottom:14px;}
  .visit-item{
    background:var(--krem-card); border:1px solid var(--garis); border-radius:10px;
    padding:14px 15px; margin-bottom:10px; cursor:pointer;
  }
  .visit-item .top{display:flex; justify-content:space-between; align-items:baseline;}
  .visit-item .id{font-family:var(--font-m); font-size:11px; color:var(--ink-soft);}
  .visit-item .tgl{font-size:11.5px; color:var(--ink-soft);}
  .visit-item h3{font-family:var(--font-d); font-size:15.5px; margin:4px 0 2px; color:var(--coklat-dark);}
  .visit-item .meta{font-size:12px; color:var(--ink-soft);}
  .visit-detail{display:none; margin-top:10px; border-top:1px dashed var(--garis); padding-top:10px;}
  .visit-detail.open{display:block;}
  .empty-state{text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px;}

  /* ---------- PRINT VIEW ---------- */
  #printArea{display:none;}
  .blangko-page{
    background:#fff; padding:26px 22px; max-width:640px; margin:0 auto 14px;
    border:1px solid var(--garis); border-radius:8px;
  }
  .blangko-title{text-align:center; font-family:var(--font-d); font-weight:700; font-size:14px; text-decoration:underline; margin-bottom:3px;}
  .blangko-warga-label{font-family:var(--font-d); font-weight:700; font-size:13px; border-bottom:2px solid var(--ink); padding-bottom:2px; margin-bottom:2px;}
  .blangko-id-rows{font-size:12px; margin-bottom:1px; display:flex; justify-content:space-between; gap:10px;}
  .blangko-id-rows b{font-weight:700;}
  .blangko-id-rows .id-left{flex:1;}
  .blangko-id-rows .id-right{flex:none; white-space:nowrap;}
  .circled-print{position:relative; display:inline-block; padding:1px 10px;}
  .circled-print svg{position:absolute; inset:-8px -4px; width:calc(100% + 8px); height:calc(100% + 16px);}
  .circled-print path{fill:none; stroke:#111; stroke-width:2.6; stroke-linecap:round;}
  .blangko-note{font-size:12px; margin:3px 0 3px;}
  .blangko-table{border:1px solid var(--ink); margin-bottom:4px; box-sizing:border-box; display:grid; grid-template-columns:36% 1fr;}
  .blangko-table .h-aspek, .blangko-table .h-info{background:#DCDCDC; font-weight:700; font-size:11.5px; text-align:center; padding:4px; border-bottom:1px solid var(--ink); box-sizing:border-box;}
  .blangko-table .h-aspek{border-right:1px solid var(--ink);}
  .blangko-table .aspek-col{border-right:1px solid var(--ink); padding:4px; box-sizing:border-box;}
  .blangko-table .info-col{padding:4px; font-size:11.5px; white-space:pre-wrap; box-sizing:border-box;}
  .blangko-aspek-cols{display:flex; gap:4px;}
  .blangko-aspek-cols > div{flex:1;}
  .print-aspek-item{display:flex; align-items:center; gap:5px; font-size:10.5px; margin-bottom:2px;}
  .print-box{width:10px;height:10px; border:1.3px solid var(--ink); flex:none; position:relative;}
  .print-box.on::after{content:"✓"; position:absolute; inset:-3px 0 0 -1px; font-size:10px; font-weight:900;}
  .blangko-tl{border:1px solid var(--ink); margin-bottom:3px;}
  .blangko-tl .head{background:#DCDCDC; font-weight:700; font-size:11.5px; text-align:center; padding:3px; border-bottom:1px solid var(--ink);}
  .blangko-tl .body{padding:5px; font-size:11.5px; min-height:115px; white-space:pre-wrap;}
  .sig-cols{display:flex; margin-top:1px;}
  .sig-cols > div{flex:1; padding:0 4px; text-align:center;}
  .sig-cols .role{font-size:10.5px; font-weight:700; min-height:22px; display:flex; align-items:flex-end; justify-content:center;}
  .sig-img{height:48px; display:flex; align-items:flex-end; justify-content:center; margin:2px 0 1px;}
  .sig-img img{max-height:44px; max-width:100%;}
  .sig-name{font-size:10.5px; padding-top:1px; margin-top:1px;}
  .sig-blank{display:inline-block; width:120px; border-bottom:1px dotted var(--ink); height:1px; vertical-align:middle;}
  .doc-title{text-align:center; font-family:var(--font-d); font-weight:700; font-size:15px; margin-bottom:16px;}
  .doc-warga-label{font-family:var(--font-d); font-weight:700; font-size:13.5px; margin:8px 0 8px;}
  .doc-photos + .doc-warga-label{margin-top:46px;}
  .doc-photos{display:flex; flex-direction:column; gap:12px;}
  .doc-photos .photo-box{width:92%; margin:0; position:relative; height:0; padding-top:46%; overflow:hidden; border:2px solid var(--ink); border-radius:4px; background:#f2ede0;}
  .doc-photos .photo-box img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;}
  .print-actions{display:flex; gap:10px; margin:14px 0 28px;}

  /* ---------- MODAL ATUR POSISI FOTO ---------- */
  .photo-adjust-modal{position:fixed; inset:0; background:rgba(42,33,24,0.78); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px;}
  .pa-card{background:var(--krem-card); border-radius:14px; padding:18px; max-width:460px; width:100%; box-shadow:var(--shadow);}
  .pa-title{font-family:var(--font-d); font-weight:700; font-size:16px; margin:0 0 3px; color:var(--coklat-dark);}
  .pa-desc{font-size:12px; color:var(--ink-soft); margin:0 0 14px;}
  .pa-frame{position:relative; width:100%; aspect-ratio:2/1; overflow:hidden; border-radius:8px; border:2px solid var(--emas); background:#1a1410; touch-action:none; cursor:grab;}
  .pa-frame.dragging{cursor:grabbing;}
  .pa-frame img{position:absolute; user-select:none; -webkit-user-drag:none; pointer-events:none;}
  .pa-actions{display:flex; gap:10px; margin-top:14px;}

  @media print{
    @page{ margin: 0; size: A4; }
    body{ margin:0; }
    .topbar, #alertBox, #wizardView, #successView, #quickDocView, #historyView{ display:none !important; }
    #printArea{display:block !important; width:100%; margin:0; padding:0;}
    .blangko-page{border:none; box-shadow:none; page-break-inside:avoid; max-width:none; width:100%; margin:0; padding:4mm 2mm 0mm;}
    .blangko-page.doc-page{padding:6mm 12mm 0mm; page-break-before:always;}
    .print-actions{display:none !important;}
  }

  @media (max-width:380px){
    .aspek-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <p class="eyebrow"><span class="dot"></span>POLDA NTB · BHABINKAMTIBMAS</p>
    <h1>Kunjungan Polmas<br>"Presisi Warga NTB"</h1>
    <p class="sub">Formulir digital pengganti blangko cetak</p>
    <div class="topnav">
      <button id="navFormBtn" class="active">📝 Formulir</button>
      <button id="navDocBtn">🖼️ Dokumentasi</button>
      <button id="navHistBtn">🗂️ Riwayat</button>
    </div>
  </div>

  <main>
    <div id="alertBox"></div>

    <!-- ===================== WIZARD ===================== -->
    <div id="wizardView">
      <div class="stepper" id="stepper"></div>
      <div id="stepBody"></div>
      <div class="btn-row" id="navRow"></div>
    </div>

    <!-- ===================== SUCCESS ===================== -->
    <div id="successView" style="display:none;"></div>

    <!-- ===================== DOKUMENTASI SAJA (tanpa TTD) ===================== -->
    <div id="quickDocView" style="display:none;">
      <div id="quickDocBody"></div>
    </div>

    <!-- ===================== HISTORY ===================== -->
    <div id="historyView" style="display:none;">
      <div class="field search-box">
        <input type="text" id="searchInput" placeholder="Cari nama warga / petugas / tanggal...">
      </div>
      <div id="historyList"></div>

/* ==================================================================
   UTIL: SIGNATURE PAD
   ================================================================== */
class SignaturePad{
  constructor(canvas){
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    this.drawing = false; this.empty = true;
    this._resize();
    this._bind();
  }
  _resize(){
    const ratio = Math.max(window.devicePixelRatio||1,1);
    const rect = this.canvas.getBoundingClientRect();
    this.canvas.width = rect.width*ratio;
    this.canvas.height = rect.height*ratio;
    this.ctx.scale(ratio,ratio);
    this.ctx.lineWidth = 2.3; this.ctx.lineCap='round'; this.ctx.lineJoin='round';
    this.ctx.strokeStyle = '#2A2118';
  }
  _pos(evt){
    const rect = this.canvas.getBoundingClientRect();
    return { x: evt.clientX-rect.left, y: evt.clientY-rect.top };
  }
  _bind(){
    const start = e=>{ e.preventDefault(); this.drawing=true; this.empty=false; const p=this._pos(e); this.ctx.beginPath(); this.ctx.moveTo(p.x,p.y); this.canvas.setPointerCapture(e.pointerId); };
    const move = e=>{ if(!this.drawing) return; e.preventDefault(); const p=this._pos(e); this.ctx.lineTo(p.x,p.y); this.ctx.stroke(); };
    const end = e=>{ this.drawing=false; };
    this.canvas.addEventListener('pointerdown', start);
    this.canvas.addEventListener('pointermove', move);
    this.canvas.addEventListener('pointerup', end);
    this.canvas.addEventListener('pointercancel', end);
  }
  clear(){ this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height); this.empty=true; }
  isEmpty(){ return this.empty; }
  toDataURL(){ return this.canvas.toDataURL('image/png'); }
}

/* ==================================================================
   UTIL: KOMPRESI FOTO
   ================================================================== */
function compressImage(file, maxW=1280, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ==================================================================
   MODAL ATUR POSISI FOTO — geser foto dalam bingkai 2:1 sebelum disimpan,
   hasil akhirnya langsung dipotong (bukan cuma object-position CSS) supaya
   konsisten di mana pun foto ditampilkan (thumbnail, cetak, riwayat).
   ================================================================== */
let paState = null;
let paResolve = null;

function openPhotoAdjuster(dataUrl){
  return new Promise(resolve=>{
    paResolve = resolve;
    const modal = document.getElementById('photoAdjustModal');
    const imgEl = document.getElementById('paImg');
    const frame = document.getElementById('paFrame');
    modal.style.display = 'flex';
    imgEl.onload = ()=>{
      const rect = frame.getBoundingClientRect();
      const frameW = rect.width, frameH = rect.height;
      const natW = imgEl.naturalWidth, natH = imgEl.naturalHeight;
      const scale = Math.max(frameW/natW, frameH/natH);
      const dispW = natW*scale, dispH = natH*scale;
      paState = {
        imgEl, scale, dispW, dispH, frameW, frameH,
        offX:(frameW-dispW)/2, offY:(frameH-dispH)/2
      };
      applyPaTransform();
    };
    imgEl.src = dataUrl;
  });
}
function applyPaTransform(){
  const s = paState;
  s.imgEl.style.width = s.dispW+'px';
  s.imgEl.style.height = s.dispH+'px';
  s.imgEl.style.left = s.offX+'px';
  s.imgEl.style.top = s.offY+'px';
}
function clampPa(){
  const s = paState;
  const minX = Math.min(0, s.frameW - s.dispW);
  const minY = Math.min(0, s.frameH - s.dispH);
  s.offX = Math.max(minX, Math.min(0, s.offX));
  s.offY = Math.max(minY, Math.min(0, s.offY));
}
(function initPaDrag(){
  const frame = document.getElementById('paFrame');
  let dragging = false, startX=0, startY=0, startOffX=0, startOffY=0;
  frame.addEventListener('pointerdown', e=>{
    if(!paState) return;
    dragging = true; frame.classList.add('dragging');
    startX = e.clientX; startY = e.clientY;
    startOffX = paState.offX; startOffY = paState.offY;
    frame.setPointerCapture(e.pointerId);
  });
  frame.addEventListener('pointermove', e=>{
    if(!dragging || !paState) return;
    paState.offX = startOffX + (e.clientX - startX);
    paState.offY = startOffY + (e.clientY - startY);
    clampPa();
    applyPaTransform();
  });
  const endDrag = ()=>{ dragging = false; frame.classList.remove('dragging'); };
  frame.addEventListener('pointerup', endDrag);
  frame.addEventListener('pointercancel', endDrag);
})();
document.getElementById('paConfirm').addEventListener('click', ()=>{
  if(!paState) return;
  const s = paState;
  const sx = (-s.offX)/s.scale, sy = (-s.offY)/s.scale;
  const sw = s.frameW/s.scale, sh = s.frameH/s.scale;
  const canvas = document.createElement('canvas');
  canvas.width = 1000; canvas.height = 500;
  canvas.getContext('2d').drawImage(s.imgEl, sx, sy, sw, sh, 0, 0, 1000, 500);
  const result = canvas.toDataURL('image/jpeg', 0.82);
  document.getElementById('photoAdjustModal').style.display = 'none';
  paState = null;
  const r = paResolve; paResolve = null;
  if(r) r(result);
});
document.getElementById('paCancel').addEventListener('click', ()=>{
  document.getElementById('photoAdjustModal').style.display = 'none';
  paState = null;
  const r = paResolve; paResolve = null;
  if(r) r(null);
});

/**
 * Mengikat sebuah upload-box supaya bisa: (1) diketuk untuk memilih file,
 * (2) menerima drag & drop file langsung dari File Explorer.
 * onFiles(files) dipanggil dengan array File setiap kali ada foto masuk.
 */
function bindUploadBox(box, onFiles){
  const input = box.querySelector('input[type=file]');
  box.addEventListener('click', ()=> input.click());
  input.addEventListener('change', e=>{
    const files = Array.from(e.target.files);
    if(files.length) onFiles(files);
    e.target.value = '';
  });
  ['dragover','dragenter'].forEach(evt => box.addEventListener(evt, e=>{
    e.preventDefault(); e.stopPropagation(); box.classList.add('drag-over');
  }));
  ['dragleave','dragend'].forEach(evt => box.addEventListener(evt, e=>{
    e.preventDefault(); box.classList.remove('drag-over');
  }));
  box.addEventListener('drop', e=>{
    e.preventDefault(); e.stopPropagation(); box.classList.remove('drag-over');
    const files = Array.from(e.dataTransfer.files).filter(f=> f.type.startsWith('image/'));
    if(files.length) onFiles(files);
  });
}

/** Proses berurutan: kompres -> atur posisi (modal) -> masukkan ke array target -> callback render. */
async function processAndAddPhotos(files, targetArray, onEachAdded){
  for(const file of files){
    const resized = await compressImage(file, 1280, 0.8);
    const cropped = await openPhotoAdjuster(resized);
    if(cropped){
      targetArray.push(cropped);
      onEachAdded();
    }
  }
}

      </div>
    </div>`;
  });
  return html;
}

/* ==================================================================
   HELPERS
   ================================================================== */
function activeWarga(){
  const arr = [{ w: state.warga[0], idx:0 }];
  if(state.adaWargaKedua) arr.push({ w: state.warga[1], idx:1 });
  return arr;
}
function esc(v){ return (v===undefined||v===null) ? '' : String(v).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function fmtTgl(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return `${parseInt(d)} ${bulan[parseInt(m)-1]} ${y}`;
}

/* ==================================================================
   BIND EVENTS PER STEP
   ================================================================== */
function bindStepEvents(){
  document.querySelectorAll('[data-w][data-f]').forEach(el=>{
    el.addEventListener('input', e=>{
      const idx = +el.dataset.w, f = el.dataset.f;
      state.warga[idx][f] = el.dataset.numeric ? el.value.replace(/\D/g,'') : el.value;
      if(el.dataset.numeric && el.value !== state.warga[idx][f]) el.value = state.warga[idx][f];
    });
  });
  document.querySelectorAll('select[data-f="pekerjaan"]').forEach(el=>{
    el.addEventListener('change', ()=>{ renderStep(); });
  });
  document.querySelectorAll('.gender-chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = +el.dataset.w;
      state.warga[idx].gender = el.dataset.gender;
      renderStep();
    });
  });
  document.querySelectorAll('.aspek-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = +el.dataset.w, a = el.dataset.aspek;
      const arr = state.warga[idx].aspek;
      const pos = arr.indexOf(a);
      if(pos>-1) arr.splice(pos,1); else arr.push(a);
      renderStep();
      document.getElementById('stepBody').scrollTop;
    });
  });

  const tgl = document.getElementById('f_tanggal');
  if(tgl) tgl.addEventListener('input', ()=> state.tanggal = tgl.value);
  const pet = document.getElementById('f_petugas');
  if(pet) pet.addEventListener('input', ()=> state.namaPetugas = pet.value);

  const toggle = document.getElementById('toggleWargaDua');
  if(toggle) toggle.addEventListener('change', ()=>{ state.adaWargaKedua = toggle.checked; renderStep(); });

  // upload foto — tiap foto lewat modal "atur posisi" dulu sebelum disimpan
  // (mendukung klik/tap maupun drag & drop dari File Explorer)
  document.querySelectorAll('[data-upload]').forEach(box=>{
    const idx = box.dataset.upload;
    bindUploadBox(box, files => processAndAddPhotos(files, state.warga[+idx].fotos, renderStep));
  });
  document.querySelectorAll('[data-rmfoto]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const idx = +btn.dataset.rmfoto, fi = +btn.dataset.fi;
      state.warga[idx].fotos.splice(fi,1);
      renderStep();
    });
  });

  // signature pads
  sigPads = {};
  const petCanvas = document.getElementById('sig_petugas');
  if(petCanvas){ sigPads.petugas = new SignaturePad(petCanvas); if(state.ttdPetugas) drawExisting(petCanvas, state.ttdPetugas); }
  activeWarga().forEach(({idx})=>{
    const wc = document.getElementById('sig_warga'+idx);
    if(wc){ sigPads['warga'+idx] = new SignaturePad(wc); if(state.warga[idx].ttdWarga) drawExisting(wc, state.warga[idx].ttdWarga); }
    const kc = document.getElementById('sig_ketua'+idx);
    if(kc){ sigPads['ketua'+idx] = new SignaturePad(kc); if(state.warga[idx].ttdKetuaRT) drawExisting(kc, state.warga[idx].ttdKetuaRT); }
  });
  document.querySelectorAll('[data-clearsig]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.clearsig;
      if(sigPads[key]) sigPads[key].clear();
      if(key==='petugas') state.ttdPetugas=null;
      else if(key.startsWith('warga')) state.warga[+key.slice(5)].ttdWarga=null;
      else if(key.startsWith('ketua')) state.warga[+key.slice(5)].ttdKetuaRT=null;
    });
  });
  const copyKetua = document.getElementById('copyKetua');
  if(copyKetua) copyKetua.addEventListener('change', ()=>{
    const wrap = document.getElementById('ketuaPadWrap1');
    const overlay = document.getElementById('ketuaOverlay1');
    if(copyKetua.checked){
      wrap.classList.add('copied');
      overlay.textContent = 'Memakai tanda tangan Ketua RT/RW Warga I';
    } else {
      wrap.classList.remove('copied');
    }
  });
}
function drawExisting(canvas, dataUrl){
  const img = new Image();
  img.onload = ()=>{
    const ctx = canvas.getContext('2d');
    const ratio = Math.max(window.devicePixelRatio||1,1);
    ctx.drawImage(img,0,0,canvas.width/ratio,canvas.height/ratio);
  };
  img.src = dataUrl;
}

/* ==================================================================
   NAVIGASI
   ================================================================== */
function renderNav(){
  const nav = document.getElementById('navRow');
  const isFirst = state.step===0;
  const isLast = state.step===STEPS.length-1;
  nav.innerHTML = `
    ${!isFirst ? '<button class="btn btn-ghost" id="btnBack">← Kembali</button>' : ''}
    ${!isLast ? '<button class="btn btn-primary" id="btnNext">Lanjut →</button>' : '<button class="btn btn-gold btn-full" id="btnSubmit">📨 Kirim Laporan</button>'}
  `;
  const back = document.getElementById('btnBack');
  if(back) back.addEventListener('click', ()=>{ persistCurrentSigs(); state.step--; renderStep(); scrollTop(); });
  const next = document.getElementById('btnNext');
  if(next) next.addEventListener('click', ()=>{
    if(!validateStep()) return;
    persistCurrentSigs();
    state.step++;
    renderStep();
    scrollTop();
  });
  const submit = document.getElementById('btnSubmit');
  if(submit) submit.addEventListener('click', doSubmit);
}
function scrollTop(){ window.scrollTo({top:0, behavior:'smooth'}); }

function persistCurrentSigs(){
  if(sigPads.petugas && !sigPads.petugas.isEmpty()) state.ttdPetugas = sigPads.petugas.toDataURL();
  activeWarga().forEach(({idx})=>{
    if(sigPads['warga'+idx] && !sigPads['warga'+idx].isEmpty()) state.warga[idx].ttdWarga = sigPads['warga'+idx].toDataURL();
    if(sigPads['ketua'+idx] && !sigPads['ketua'+idx].isEmpty()) state.warga[idx].ttdKetuaRT = sigPads['ketua'+idx].toDataURL();
  });
  const copyKetua = document.getElementById('copyKetua');
  if(copyKetua && copyKetua.checked){
    state.warga[1].ttdKetuaRT = state.warga[0].ttdKetuaRT;
  }
}

function validateStep(){
  clearAlert();
  if(state.step===0){
    if(!state.tanggal){
      return showAlertErr('Tanggal kunjungan wajib diisi.');
    }
    const w = state.warga[0];
    if(!w.gender || !w.umur || !w.alamat.trim()){
      return showAlertErr('Jenis kelamin, umur, dan alamat wajib diisi untuk Warga I.');
    }
  }
  if(state.step===1 && state.adaWargaKedua){
    const w = state.warga[1];
    if(!w.gender || !w.umur || !w.alamat.trim()){
      return showAlertErr('Jenis kelamin, umur, dan alamat wajib diisi untuk Warga II.');
    }
  }
  if(state.step===2){
    for(const {w} of activeWarga()){
      if(w.fotos.length===0) return showAlertErr('Unggah minimal 1 foto dokumentasi untuk Warga '+w.label+'.');
    }
    persistCurrentSigs();
  }
  return true;
}
function showAlertErr(msg){
  document.getElementById('alertBox').innerHTML = `<div class="banner-err">⚠️ ${msg}</div>`;
  scrollTop();
  return false;
}
function clearAlert(){ document.getElementById('alertBox').innerHTML=''; }

/* ==================================================================
   SUBMIT
   ================================================================== */
async function doSubmit(){
  persistCurrentSigs();
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = 'Mengirim...';

  const payload = {
    action: 'submit',
    tanggal: state.tanggal,
    namaPetugas: state.namaPetugas,
    ttdPetugas: state.ttdPetugas,
    warga: activeWarga().map(({w})=>({
      label: w.label, nama: w.nama, gender: w.gender==='Lk'?'Laki-laki':'Perempuan',
      umur: w.umur, pekerjaan: (w.pekerjaan==='Lainnya' ? (w.pekerjaanLainnya.trim()||'Lainnya') : w.pekerjaan), telp: w.telp, alamat: w.alamat,
      aspek: w.aspek, informasi: w.informasi, tindakLanjut: w.tindakLanjut,
      namaKetuaRT: w.namaKetuaRT, fotos: w.fotos, ttdWarga: w.ttdWarga, ttdKetuaRT: w.ttdKetuaRT
    }))
  };

  try{
    const res = await fetch(CONFIG.API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if(json.ok){
      showSuccess(json.idKunjungan, payload);
    } else {
      showAlertErr(json.error || 'Gagal menyimpan data.');
      btn.disabled=false; btn.textContent='📨 Kirim Laporan';
    }
  }catch(err){
    showAlertErr('Tidak dapat terhubung ke server. Periksa koneksi internet atau URL API.');
    btn.disabled=false; btn.textContent='📨 Kirim Laporan';
  }
}

function showSuccess(idKunjungan, payload){
  document.getElementById('wizardView').style.display='none';
  const sv = document.getElementById('successView');
  sv.style.display='block';
  sv.innerHTML = `
    <div class="card success">
      <div class="ring">✓</div>
      <h2>Laporan Tersimpan</h2>
      <p>Data kunjungan berhasil dikirim ke sistem.</p>
      <div class="idbox">${idKunjungan}</div>
      <div class="btn-row">
        <button class="btn btn-gold" id="btnCetak">🖨️ Cetak Blangko</button>
        <button class="btn btn-ghost" id="btnBaru">+ Laporan Baru</button>
      </div>
    </div>`;
  document.getElementById('btnCetak').addEventListener('click', ()=>{
    buildPrintArea(idKunjungan, payload);
    setTimeout(()=>window.print(), 150);
  });
  document.getElementById('btnBaru').addEventListener('click', ()=>{
    Object.assign(state, {
      step:0, tanggal:new Date().toISOString().slice(0,10), namaPetugas:'',
      adaWargaKedua:false, warga:[makeWarga('I'), makeWarga('II')], ttdPetugas:null
    });
    sv.style.display='none';
    document.getElementById('wizardView').style.display='block';
    const submitBtnCheck = null;
    renderStep();
  });
  scrollTop();
}

let historyCache = [];
async function loadHistory(){
  document.getElementById('historyList').innerHTML = '<div class="empty-state">Memuat riwayat...</div>';
  try{
    const res = await fetch(CONFIG.API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'list', limit:300 })
    });
    const json = await res.json();
    if(json.ok){ historyCache = json.rows; renderHistory(historyCache); }
    else document.getElementById('historyList').innerHTML = `<div class="empty-state">Gagal memuat: ${json.error||''}</div>`;
  }catch(err){
    document.getElementById('historyList').innerHTML = '<div class="empty-state">Tidak dapat terhubung ke server.</div>';
  }
}
function groupByVisit(rows){
  const map = {};
  rows.forEach(r=>{
    if(!map[r.idKunjungan]) map[r.idKunjungan] = [];
    map[r.idKunjungan].push(r);
  });
  return Object.keys(map).map(id=>({ id, rows: map[id] }));
}
function renderHistory(rows){
  const visits = groupByVisit(rows);
  const list = document.getElementById('historyList');
  if(visits.length===0){ list.innerHTML = '<div class="empty-state">Belum ada data kunjungan.</div>'; return; }
  list.innerHTML = visits.map(v=>{
    const first = v.rows[0];
    const namaWarga = v.rows.map(r=>r.nama).filter(Boolean).join(', ');
    return `
    <div class="visit-item" data-visit="${v.id}">
      <div class="top"><span class="id">${v.id}</span><span class="tgl">${first.tanggal}</span></div>
      <h3>${esc(namaWarga)||'(tanpa nama)'}</h3>
      <div class="meta">Petugas: ${esc(first.namaPetugas)} · ${v.rows.length} warga</div>
      <div class="visit-detail" id="detail_${v.id}">
        ${v.rows.map(r=>`
          <div style="margin-bottom:10px;">
            <div style="font-weight:700;font-size:12.5px;">Warga ${r.wargaKe} — ${esc(r.nama)}</div>
            <div style="font-size:12px;color:var(--ink-soft);">${r.gender} · ${r.umur} th · ${esc(r.pekerjaan)||'-'}</div>
            <div style="font-size:11.5px;margin-top:2px;">Aspek: ${esc(r.aspek)||'-'}</div>
          </div>
        `).join('')}
        <button class="btn btn-gold btn-full" data-cetakvisit="${v.id}">🖨️ Cetak Blangko</button>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('.visit-item').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('[data-cetakvisit]')) return;
      const id = el.dataset.visit;
      document.getElementById('detail_'+id).classList.toggle('open');
    });
  });
  document.querySelectorAll('[data-cetakvisit]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      e.stopPropagation();
      const id = btn.dataset.cetakvisit;
      const originalTxt = btn.textContent;
      btn.disabled = true; btn.textContent = 'Memuat gambar...';
      try{
        // Ambil ulang data KHUSUS kunjungan ini dengan foto/ttd sudah disertakan
        // penuh (action=list hanya berisi data ringan tanpa gambar).
        const res = await fetch(CONFIG.API_URL, {
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({ action:'get', idKunjungan:id })
        });
        const json = await res.json();
        if(!json.ok || !json.rows || json.rows.length===0){
          alert('Gagal memuat data cetak untuk kunjungan ini.');
          return;
        }
        const rows = json.rows;
        const payload = {
          ttdPetugas: rows[0].ttdPetugas,
          warga: rows.map(r=>({
            label:r.wargaKe, nama:r.nama, gender:r.gender, umur:r.umur, pekerjaan:r.pekerjaan,
            telp:r.telp, alamat:r.alamat, aspek: r.aspek? r.aspek.split(',').map(s=>s.trim()):[],
            informasi:r.informasi, tindakLanjut:r.tindakLanjut, namaKetuaRT:r.namaKetuaRT,
            fotos: r.foto? r.foto.split('|||').map(s=>s.trim()).filter(Boolean):[],
            ttdWarga:r.ttdWarga, ttdKetuaRT:r.ttdKetuaRT
          }))
        };
        state.namaPetugas = rows[0].namaPetugas;
        buildPrintArea(id, payload);
        setTimeout(()=>window.print(), 150);
      }catch(err){
        alert('Tidak dapat terhubung ke server untuk memuat data cetak.');
      }
      btn.disabled = false; btn.textContent = originalTxt;
    });
  });
}
document.getElementById('searchInput')?.addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();
  const filtered = historyCache.filter(r =>
    (r.nama||'').toLowerCase().includes(q) ||
    (r.namaPetugas||'').toLowerCase().includes(q) ||
    (r.tanggal||'').toLowerCase().includes(q)
  );
  renderHistory(filtered);
});
